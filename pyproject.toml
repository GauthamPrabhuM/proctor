[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proctor-audit"
dynamic = ["version"]
description = "Audit Claude Code and Anthropic API usage for token waste"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["claude", "anthropic", "llm", "cost", "tokens", "observability"]
authors = [{ name = "Gautham Prabhu" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
proctor = "proctor.cli:main"

[project.urls]
Homepage = "https://github.com/GauthamPrabhuM/proctor"
Issues = "https://github.com/GauthamPrabhuM/proctor/issues"
Changelog = "https://github.com/GauthamPrabhuM/proctor/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/proctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["proctor"]
branch = true

[tool.ruff]
line-length = 90
target-version = "py39"
src = ["src", "tests"]
# Documentation snippets are illustrative and aligned for readability; leave
# them to the author rather than the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
files = ["src/proctor"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
